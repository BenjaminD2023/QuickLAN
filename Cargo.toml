[workspace]
members = ["crates/quicklan-core", "crates/quicklan-ipc", "crates/quicklan-runtime"]
exclude = ["src-tauri", "engine"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.96"

[profile.release]
codegen-units = 1
lto = true
strip = true
