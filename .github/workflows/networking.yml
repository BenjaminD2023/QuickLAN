name: Native networking implementation
on:
  push:
    branches: [main, feature/native-networking]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: networking-${{ github.ref }}
  cancel-in-progress: false
jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
            src-tauri/target
            target
          key: native-${{ matrix.runner }}-rust196-${{ hashFiles('engine/Cargo.lock', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            native-${{ matrix.runner }}-rust196-${{ hashFiles('engine/Cargo.lock', 'Cargo.lock') }}-
            native-${{ matrix.runner }}-rust196-
      - name: Install protobuf compiler on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install protobuf compiler on macOS
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install protobuf compiler on Windows
        if: runner.os == 'Windows'
        run: choco install protoc --version=31.1 -y --no-progress
      - name: Verify domain and native IPC
        run: cargo test --workspace --all-features --locked
      - name: Prepare pinned core with reviewed policy patch
        run: python scripts/prepare-engine.py
      - name: Build networking engine
        id: engine_build
        run: cargo build --manifest-path engine/Cargo.toml --release --locked
      - name: Stage production engine and Windows driver
        run: python scripts/stage-engine.py
      - name: Build native acceptance driver
        run: cargo build -p quicklan-runtime --example engine_smoke --locked
      - name: Real adapter and cleanup on Unix
        if: runner.os != 'Windows'
        run: sudo --preserve-env=CI ./target/debug/examples/engine_smoke ./src-tauri/resources/engine/quicklan-engine
      - name: Real adapter and cleanup on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./target/debug/examples/engine_smoke.exe ./src-tauri/resources/engine/quicklan-engine.exe
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: runner.os != 'Linux'
        with:
          node-version: 22.22.3
          cache: npm
      - name: Verify desktop application
        if: runner.os != 'Linux'
        run: |
          npm ci
          npm run lint
          npm run build
          npm test
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings
          npx playwright install chromium --only-shell
          npm run test:e2e
          git restore docs/evidence/ui-*.png
      - name: Build macOS application and disk image
        if: runner.os == 'macOS'
        run: |
          npm run tauri -- build --bundles app,dmg -- --locked
          python scripts/verify-macos-bundle.py
      - name: Build and install Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm run tauri -- build --bundles nsis -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/windows-installer-smoke.ps1 -BundleRoot src-tauri/target/release/bundle -RequireEngine
      - name: Verify explicit firewall controls and restore original settings
        shell: bash
        if: runner.os != 'Linux'
        run: |
          cargo build -p quicklan-runtime --example firewall_smoke --locked
          python scripts/firewall-smoke.py
      - name: Record native build checksums
        if: runner.os != 'Linux'
        run: python scripts/build-manifest.py --bundle-root src-tauri/target/release/bundle --target ${{ matrix.runner }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: runner.os != 'Linux'
        with:
          name: quicklan-networking-installer-${{ matrix.runner }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/firewall-smoke.json
            src-tauri/target/release/bundle/windows-smoke.json
            src-tauri/target/release/bundle/macos-smoke.json
            src-tauri/target/release/bundle/BUILD.json
            src-tauri/target/release/bundle/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quicklan-engine-${{ matrix.runner }}
          path: src-tauri/resources/engine/
          retention-days: 7
          if-no-files-found: error
      - name: Build isolated integration transport
        if: runner.os == 'Linux'
        run: cargo build --manifest-path engine/Cargo.toml --release --features lab --examples --bins --locked
      - name: Real QuickLAN TCP and UDP networking
        if: runner.os == 'Linux'
        run: |
          sudo --preserve-env=CI python3 scripts/engine-integration.py --engine engine/target/release/quicklan-engine --transport tcp
          sudo --preserve-env=CI python3 scripts/engine-integration.py --engine engine/target/release/quicklan-engine --transport udp
          sudo --preserve-env=CI python3 scripts/engine-integration.py --engine engine/target/release/quicklan-engine --transport tcp --relay-lab engine/target/release/examples/relay_lab
          sudo --preserve-env=CI python3 scripts/engine-integration.py --engine engine/target/release/quicklan-engine --transport udp --relay-lab engine/target/release/examples/relay_lab
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: runner.os == 'Linux'
        with:
          name: quicklan-engine-payload-evidence
          path: docs/evidence/engine-integration-*.json
          if-no-files-found: error
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.engine_build.outcome == 'success'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
            src-tauri/target
            target
          key: native-${{ matrix.runner }}-rust196-${{ hashFiles('engine/Cargo.lock', 'Cargo.lock') }}-${{ github.sha }}
