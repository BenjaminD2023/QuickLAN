name: Dependency and source security checks
on:
  push:
    branches: [main, feature/native-networking]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file Cargo.lock
      - run: cargo audit --file src-tauri/Cargo.lock
      - run: cargo audit --file engine/Cargo.lock
      - name: Scan tracked source for leaked secrets
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner
