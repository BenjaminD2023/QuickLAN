name: Engineering checks and native bundles
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install pinned Rust
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy --target ${{ matrix.target }}
      - run: npm ci
      - run: npm run check
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --all-features --all-targets --locked -- -D warnings
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings
      - name: Verify the real Windows credential store
        if: runner.os == 'Windows'
        run: cargo test --all-features --locked --test security native_credential_round_trip -- --ignored
      - run: npx playwright install chromium --only-shell
      - run: npm run test:e2e
      - name: Package engineering preview without signing secrets
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Install, launch, close and uninstall the Windows preview
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-installer-smoke.ps1 -BundleRoot src-tauri/target/${{ matrix.target }}/release/bundle
      - name: Record checksums and build metadata
        run: python scripts/build-manifest.py --bundle-root src-tauri/target/${{ matrix.target }}/release/bundle --target ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quicklan-engineering-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/BUILD.json
            src-tauri/target/${{ matrix.target }}/release/bundle/SHA256SUMS
            src-tauri/target/${{ matrix.target }}/release/bundle/windows-smoke.json
          if-no-files-found: error
          retention-days: 7
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.3
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file Cargo.lock
      - run: cargo audit --file src-tauri/Cargo.lock
      - name: Scan tracked source for leaked secrets
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner
