[package]
name = "quicklan"
version = "0.2.0"
description = "Private networks with friends — engineering preview"
authors = ["QuickLAN contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.96"

[lib]
name = "quicklan_desktop"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
sha2 = "=0.10.9"

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-single-instance = "=2.4.4"
tauri-plugin-clipboard-manager = "=2.3.3"
quicklan-core = { path = "../crates/quicklan-core", features = ["os-vault"] }
quicklan-runtime = { path = "../crates/quicklan-runtime" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
zeroize = "=1.8.2"
network-interface = "=2.0.5"

[profile.release]
codegen-units = 1
lto = true
strip = true
